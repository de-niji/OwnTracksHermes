[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "owntracks-mcp"
version = "0.1.0"
description = "MCP server that gives Hermes Agent (and any other MCP client) read-only access to an OwnTracks Recorder"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.10",
    "httpx>=0.27",
    "pydantic>=2",
    "tzdata; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
owntracks-mcp = "owntracks_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/owntracks_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
